name: Compile Typst documents

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        document:
          - main-dhbw-ka
          - main-dhbw-ma
          - main-ihk
    steps:
      - uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v4

      - name: Compile ${{ matrix.document }}.typ
        run: typst compile "${{ matrix.document }}.typ" "${{ matrix.document }}.pdf"

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.document }}
          path: ${{ matrix.document }}.pdf
          if-no-files-found: error
